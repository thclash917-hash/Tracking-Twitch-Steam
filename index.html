<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Global - Gaming Trends</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --border-color: #1e293b;
            --twitch: #9146ff;
            --steam: #2563eb;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-logos {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .interactive-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 40px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .interactive-logo:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--twitch);
            box-shadow: 0 6px 20px rgba(145, 70, 255, 0.3);
        }
        .interactive-logo.shop:hover {
            border-color: var(--success);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }
        .interactive-logo img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: var(--twitch);
            border-color: var(--twitch);
        }
        .search-box {
            position: relative;
            flex: 1;
            max-width: 300px;
        }
        .search-box input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px 10px 38px;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: var(--twitch);
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .card-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background-color: rgba(255,255,255,0.02);
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            color: #fff;
            background-color: rgba(255,255,255,0.04);
        }
        .game-cell {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #222;
        }
        .game-name {
            font-weight: 600;
            font-size: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        .badge-twitch { background-color: rgba(145, 70, 255, 0.2); color: #c084fc; }
        .badge-steam { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .badge-mobile { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .trend { color: var(--success); font-weight: 500; }
        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            color: #ffffff;
            transition: transform 0.2s, color 0.2s;
        }
        .fav-btn:hover {
            transform: scale(1.2);
        }
        .fav-active {
            color: #facc15 !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-logos">
                <a href="https://www.twitch.tv/fire_bs2" target="_blank" class="interactive-logo">
                    <span>🟣</span> Mon Twitch (fire_bs2)
                </a>
                <a href="https://shop-fire-zeta.vercel.app/" target="_blank" class="interactive-logo shop">
                    <span>🛒</span> Boutique Jeux Mobiles
                </a>
            </div>
            <h1>Classement Global</h1>
            <p>Suivi en direct des tendances Twitch & Steam</p>
        </header>

        <div class="controls-bar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('all')">Tous les jeux</button>
                <button class="tab-btn" onclick="switchTab('favorites')">⭐ Favoris (<span id="fav-count">0</span>)</button>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Rechercher un jeu..." oninput="handleSearch()">
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 id="table-title">Tendances combinées</h3>
                <span id="game-count">Chargement...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Fav</th>
                        <th>#</th>
                        <th onclick="sortTable('name')">Jeu ↕</th>
                        <th onclick="sortTable('platform')">Plateforme ↕</th>
                        <th>Volume / Stats</th>
                        <th onclick="sortTable('ratio')">Ratio % ↕</th>
                    </tr>
                </thead>
                <tbody id="games-tbody">
                    <tr><td colspan="6" style="text-align: center; padding: 40px;">Chargement des données...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allGames = [];
        let currentTab = 'all';
        let searchQuery = '';
        let favorites = JSON.parse(localStorage.getItem('gaming_favorites')) || [];
        let sortDirections = { name: 'asc', platform: 'asc', ratio: 'desc' };

        async function loadGames() {
            try {
                const response = await fetch('game.json?t=' + new Date().getTime());
                allGames = await response.json();
                
                allGames = allGames.map((game, index) => ({
                    ...game,
                    // Correction du volume pour tous les jeux si non défini
                    volume: game.volume || "Spectateurs en direct",
                    ratio: (Math.max(1, (106 - (index + 1)) * 0.15)).toFixed(2)
                }));

                renderTable();
            } catch (e) {
                console.error(e);
                document.getElementById('games-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ef4444;">Erreur de chargement des données.</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('games-tbody');
            const countSpan = document.getElementById('game-count');
            tbody.innerHTML = '';

            let displayedGames = allGames;

            // Filtrage par onglet
            if (currentTab === 'favorites') {
                displayedGames = displayedGames.filter(game => favorites.includes(game.name));
            }

            // Filtrage par recherche
            if (searchQuery.trim() !== '') {
                displayedGames = displayedGames.filter(game => 
                    game.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }

            countSpan.innerText = `${displayedGames.length} éléments`;
            document.getElementById('fav-count').innerText = favorites.length;

            if (displayedGames.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: #94a3b8;">Aucun élément trouvé.</td></tr>`;
                return;
            }

            displayedGames.forEach((game, index) => {
                const rank = index + 1;
                const tr = document.createElement('tr');
                
                let badgeClass = 'badge-twitch';
                if (game.platform === 'Steam') badgeClass = 'badge-steam';
                if (game.platform.includes('Mobile') || game.platform.includes('PC/Mobile')) badgeClass = 'badge-mobile';

                const isFav = favorites.includes(game.name);

                tr.innerHTML = `
                    <td><button class="fav-btn ${isFav ? 'fav-active' : ''}" onclick="toggleFav('${game.name.replace(/'/g, "\\'")}')">⭐</button></td>
                    <td><strong>#${rank}</strong></td>
                    <td>
                        <div class="game-cell">
                            <img src="${game.image}" class="game-img" alt="${game.name}" onerror="this.src='https://picsum.photos/100/133'">
                            <div>
                                <div class="game-name">${game.name}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge ${badgeClass}">${game.platform}</span></td>
                    <td>${game.volume}</td>
                    <td class="trend">${game.ratio}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('table-title').innerText = tab === 'favorites' ? 'Mes Favoris' : 'Tendances combinées';
            renderTable();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderTable();
        }

        function toggleFav(gameName) {
            if (favorites.includes(gameName)) {
                favorites = favorites.filter(name => name !== gameName);
            } else {
                favorites.push(gameName);
            }
            localStorage.setItem('gaming_favorites', JSON.stringify(favorites));
            renderTable();
        }

        function sortTable(key) {
            let direction = sortDirections[key];
            allGames.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (key === 'ratio') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                }

                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });

            sortDirections[key] = direction === 'asc' ? 'desc' : 'asc';
            renderTable();
        }

        loadGames();
    </script>
</body>
</html>
