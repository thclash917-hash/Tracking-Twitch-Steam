<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Global - Gaming Trends</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --border-color: #1e293b;
            --twitch: #9146ff;
            --steam: #2563eb;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .card-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background-color: rgba(255,255,255,0.02);
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            color: #fff;
            background-color: rgba(255,255,255,0.04);
        }
        .game-cell {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #222;
        }
        .game-name {
            font-weight: 600;
            font-size: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        .badge-twitch { background-color: rgba(145, 70, 255, 0.2); color: #c084fc; }
        .badge-steam { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .trend { color: var(--success); font-weight: 500; }
        .fav-btn { background: none; border: none; cursor: pointer; font-size: 18px; }
        .fav-active { color: gold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Classement Global</h1>
            <p>Suivi en direct des tendances Twitch & Steam</p>
        </header>

        <div class="card">
            <div class="card-header">
                <h3>Tendances combinées</h3>
                <span id="game-count">Chargement...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Fav</th>
                        <th>#</th>
                        <th onclick="sortTable('name')">Jeu ↕</th>
                        <th onclick="sortTable('platform')">Plateforme ↕</th>
                        <th>Volume / Stats</th>
                        <th onclick="sortTable('ratio')">Ratio % ↕</th>
                    </tr>
                </thead>
                <tbody id="games-tbody">
                    <tr><td colspan="6" style="text-align: center; padding: 40px;">Chargement des données...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allGames = [];
        let sortDirections = { name: 'asc', platform: 'asc', ratio: 'desc' };

        async function loadGames() {
            try {
                const response = await fetch('game.json?t=' + new Date().getTime());
                allGames = await response.json();
                
                // Ajout d'un ratio proportionnel/dynamique pour alimenter la colonne
                allGames = allGames.map((game, index) => ({
                    ...game,
                    ratio: (Math.max(1, (101 - (index + 1)) * 0.15)).toFixed(2)
                }));

                renderTable(allGames);
            } catch (e) {
                console.error(e);
                document.getElementById('games-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ef4444;">Erreur de chargement des données.</td></tr>`;
            }
        }

        function renderTable(games) {
            const tbody = document.getElementById('games-tbody');
            const countSpan = document.getElementById('game-count');
            tbody.innerHTML = '';
            countSpan.innerText = `${games.length} jeux & catégories`;

            games.forEach((game, index) => {
                const rank = index + 1;
                const tr = document.createElement('tr');
                let badgeClass = game.platform === 'Twitch' ? 'badge-twitch' : 'badge-steam';

                tr.innerHTML = `
                    <td><button class="fav-btn" onclick="toggleFav(this)">⭐</button></td>
                    <td><strong>#${rank}</strong></td>
                    <td>
                        <div class="game-cell">
                            <img src="${game.image}" class="game-img" alt="${game.name}" onerror="this.src='https://picsum.photos/100/133'">
                            <div>
                                <div class="game-name">${game.name}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge ${badgeClass}">${game.platform}</span></td>
                    <td>${game.volume || ''}</td>
                    <td class="trend">${game.ratio}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortTable(key) {
            let direction = sortDirections[key];
            allGames.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (key === 'ratio') {
                    valA = parseFloat(valA);
                    valB = parseFloat(valB);
                }

                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });

            sortDirections[key] = direction === 'asc' ? 'desc' : 'asc';
            renderTable(allGames);
        }

        function toggleFav(btn) {
            btn.classList.toggle('fav-active');
        }

        loadGames();
    </script>
</body>
</html>
