<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Jeux - Twitch & Steam</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-twitch: #9146ff;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 30px; }
        .chart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            max-width: 900px;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .category-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .nav-arrows button {
            background: #334155;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        .nav-arrows button:hover { background: #475569; }
        .table-wrapper {
            max-height: 450px;
            overflow-y: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 8px; border-bottom: 1px solid #334155; font-size: 14px; vertical-align: middle; }
        th { position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
        .game-img {
            width: 40px;
            height: 53px;
            object-fit: cover;
            border-radius: 4px;
        }
        .highlight-brawl {
            background-color: rgba(34, 197, 94, 0.25) !important;
            font-weight: bold;
        }
        .positive { color: var(--success); }
        .negative { color: var(--danger); }
        .fav-btn { background: none; border: none; cursor: pointer; font-size: 16px; }
        .fav-active { color: gold; }
    </style>
</head>
<body>

    <header>
        <h1>Classement Global Jeux - Twitch & Steam</h1>
        <p>Suivi en direct avec Brawl Stars, Clash of Clans, Roblox et Nintendo</p>
    </header>

    <div class="chart-container">
        <h3>Croissance globale des plateformes</h3>
        <canvas id="growthChart"></canvas>
    </div>

    <div class="dashboard-grid">
        <!-- Twitch -->
        <div class="category-section">
            <div class="category-header">
                <h2>Top 100 Twitch</h2>
                <div class="nav-arrows">
                    <button onclick="scrollTable('twitch-table', 'up')">▲</button>
                    <button onclick="scrollTable('twitch-table', 'down')">▼</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="twitch-table">
                    <thead>
                        <tr>
                            <th>Fav</th>
                            <th>#</th>
                            <th>Image</th>
                            <th>Jeu</th>
                            <th>Variation</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="5">Chargement des données Twitch...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Steam -->
        <div class="category-section">
            <div class="category-header">
                <h2>Top 100 Steam</h2>
                <div class="nav-arrows">
                    <button onclick="scrollTable('steam-table', 'up')">▲</button>
                    <button onclick="scrollTable('steam-table', 'down')">▼</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="steam-table">
                    <thead>
                        <tr>
                            <th>Fav</th>
                            <th>#</th>
                            <th>Image</th>
                            <th>Jeu</th>
                            <th>Variation</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Généré par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Graphique
        const ctx = document.getElementById('growthChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10m', '20m', '30m', '40m', '50m', 'Actuel'],
                datasets: [{
                    label: 'Audience Twitch',
                    data: [1200, 1900, 3000, 5000, 4600, 6200],
                    borderColor: '#9146ff',
                    tension: 0.3
                }, {
                    label: 'Joueurs Steam',
                    data: [2500, 2400, 2700, 3100, 3400, 3800],
                    borderColor: '#38bdf8',
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: 'white' } } },
                scales: { x: { ticks: { color: 'white' } }, y: { ticks: { color: 'white' } } }
            }
        });

        // Liste des jeux favoris à injecter/garantir dans les classements
        const priorityGames = ["Brawl Stars", "Clash of Clans", "Roblox", "Super Mario Bros.", "The Legend of Zelda", "Pokémon"];

        async function loadTwitchData() {
            try {
                const response = await fetch('data.json');
                const json = await response.json();
                let games = json.data || [];

                // S'assurer que les jeux prioritaires font partie de la liste si l'API ne les remonte pas tous dans le top
                priorityGames.forEach(favName => {
                    if (!games.some(g => g.name.toLowerCase() === favName.toLowerCase())) {
                        games.push({
                            name: favName,
                            box_art_url: "https://picsum.photos/50/70?random=" + favName.length
                        });
                    }
                });

                const tbody = document.querySelector('#twitch-table tbody');
                tbody.innerHTML = "";

                games.forEach((game, index) => {
                    const rank = index + 1;
                    const tr = document.createElement('tr');
                    
                    const isPriority = priorityGames.some(p => p.toLowerCase() === game.name.toLowerCase());
                    if (game.name.toLowerCase() === "brawl stars" || isPriority) {
                        tr.classList.add('highlight-brawl');
                    }

                    let imgUrl = game.box_art_url ? game.box_art_url.replace('{width}', '50').replace('{height}', '70') : 'https://picsum.photos/50/70';

                    tr.innerHTML = `
                        <td><button class="fav-btn" onclick="toggleFav(this)">⭐</button></td>
                        <td>${rank}</td>
                        <td><img src="${imgUrl}" class="game-img" alt="${game.name}"></td>
                        <td>${game.name}</td>
                        <td class="positive">+${(Math.random() * 5).toFixed(2)}%</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                document.querySelector('#twitch-table tbody').innerHTML = `<tr><td colspan="5">En attente des données Twitch...</td></tr>`;
            }
        }

        function loadSteamData() {
            const tbody = document.querySelector('#steam-table tbody');
            tbody.innerHTML = "";
            
            // Simulation d'un Top 100 Steam intégrant les jeux demandés
            for (let i = 1; i <= 100; i++) {
                let name = `Steam Jeu ${i}`;
                if (i === 5) name = "Brawl Stars";
                if (i === 12) name = "Roblox";
                if (i === 25) name = "Clash of Clans";
                if (i === 40) name = "The Legend of Zelda";
                
                const tr = document.createElement('tr');
                if (name === "Brawl Stars" || name === "Roblox" || name === "Clash of Clans") {
                    tr.classList.add('highlight-brawl');
                }
                
                let steamImg = `https://picsum.photos/50/70?random=${i + 200}`;

                tr.innerHTML = `
                    <td><button class="fav-btn" onclick="toggleFav(this)">⭐</button></td>
                    <td>${i}</td>
                    <td><img src="${steamImg}" class="game-img" alt="${name}"></td>
                    <td>${name}</td>
                    <td class="positive">+1.50%</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function scrollTable(tableId, direction) {
            const wrapper = document.querySelector(`#${tableId}`).parentElement;
            wrapper.scrollTop += (direction === 'up' ? -150 : 150);
        }

        function toggleFav(btn) {
            btn.classList.toggle('fav-active');
        }

        loadTwitchData();
        loadSteamData();
    </script>
</body>
</html>
