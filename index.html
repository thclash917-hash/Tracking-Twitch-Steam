<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Global - Gaming Trends</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-color: #f8fafc;
            --border-color: #1e293b;
            --twitch: #9146ff;
            --steam: #2563eb;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        .card-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        th {
            background-color: rgba(255,255,255,0.02);
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .game-cell {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-img {
            width: 60px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #222;
        }
        .game-name {
            font-weight: 600;
            font-size: 16px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        .badge-twitch { background-color: rgba(145, 70, 255, 0.2); color: #c084fc; }
        .badge-steam { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .drop-tag {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
        }
        .trend { color: var(--success); font-weight: 500; }
        .fav-btn { background: none; border: none; cursor: pointer; font-size: 18px; }
        .fav-active { color: gold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Classement Global</h1>
            <p>Suivi en direct des tendances Twitch & Steam</p>
        </header>

        <div class="card">
            <div class="card-header">
                <h3>Tendances combinées</h3>
                <span id="game-count">Chargement...</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Fav</th>
                        <th>#</th>
                        <th>Jeu</th>
                        <th>Plateforme</th>
                        <th>Volume / Stats</th>
                        <th>Tendance</th>
                    </tr>
                </thead>
                <tbody id="games-tbody">
                    <tr><td colspan="6" style="text-align: center; padding: 40px;">Chargement des données...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadGames() {
            try {
                // Lecture de games.json à la racine
                const response = await fetch('games.json?t=' + new Date().getTime());
                const games = await response.json();
                
                const tbody = document.getElementById('games-tbody');
                const countSpan = document.getElementById('game-count');
                tbody.innerHTML = '';
                countSpan.innerText = `${games.length} jeux`;

                games.forEach((game, index) => {
                    const rank = index + 1;
                    const tr = document.createElement('tr');

                    let badgeClass = game.platform === 'Twitch' ? 'badge-twitch' : 'badge-steam';
                    
                    // Formatage du nombre (ex: 1 084 344)
                    const formattedMetric = game.metric ? game.metric.toLocaleString('fr-FR') : '';
                    const metricText = `${formattedMetric} ${game.metric_label || ''}`;

                    // Gestion des drops si présents
                    let dropHtml = '';
                    if (game.drops_enabled) {
                        dropHtml = `<span class="drop-tag">🎁 Drop actif</span>`;
                    }

                    tr.innerHTML = `
                        <td><button class="fav-btn" onclick="toggleFav(this)">⭐</button></td>
                        <td><strong>#${rank}</strong></td>
                        <td>
                            <div class="game-cell">
                                <img src="${game.image}" class="game-img" alt="${game.name}" onerror="this.src='https://picsum.photos/100/133'">
                                <div>
                                    <div class="game-name">${game.name}</div>
                                    ${dropHtml}
                                </div>
                            </div>
                        </td>
                        <td><span class="badge ${badgeClass}">${game.platform}</span></td>
                        <td>${metricText}</td>
                        <td class="trend">${game.trend || '+0%'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('games-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ef4444;">Erreur de chargement des données.</td></tr>`;
            }
        }

        function toggleFav(btn) {
            btn.classList.toggle('fav-active');
        }

        loadGames();
    </script>
</body>
</html>
